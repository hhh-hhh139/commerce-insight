name: Clean Linux and deployment verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository_owner == 'hhhhao139-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, run offline contracts, verify fresh Compose state and TLS
        run: python3 deployment/verify_clean_ci.py
      - name: Preserve measured results, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-linux-${{ github.sha }}
          path: .local/ci-results/
          if-no-files-found: error
          retention-days: 14
