<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Commerce Insight</title><link rel="stylesheet" href="/login.css"><script src="/login.js" defer></script></head>
<body><main><a class="brand" href="/">CI <span>Commerce Insight</span></a><section class="login-card"><div class="eyebrow">经营分析工作台</div><h1>回到你的数据。</h1><p class="intro">核查销售、定位退款变化，让每个结论都有依据。</p><form method="post" action="/login" id="login-form"><label for="username">账户</label><input id="username" name="username" value="owner" readonly autocomplete="username"><label for="password">密码</label><input id="password" name="password" type="password" required maxlength="72" autocomplete="current-password" autofocus><input id="csrf" type="hidden"><p id="message" role="status" hidden></p><button type="submit" id="login-submit" disabled>登录工作空间</button></form><div class="note">这是部署者的独立工作空间。<br>公开演示请使用项目提供的合成样例。</div></section><footer>Commerce Insight <span>销售 · 售后 · 报表核对</span></footer></main></body></html>
