# Explicit deployment profile; no fallback to a local H2 database on misconfiguration.
spring.datasource.url=${COMMERCE_DB_URL}
spring.datasource.username=${COMMERCE_DB_USER}
spring.datasource.password=${COMMERCE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
commerce.storage=postgres_single_instance
