server.address=127.0.0.1
server.port=18080
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=none
spring.main.banner-mode=off
spring.datasource.url=jdbc:h2:file:${commerce.runtime}/tasks;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0;LOCK_TIMEOUT=5000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=always
spring.flyway.enabled=false
spring.h2.console.enabled=false
commerce.lease-ms=15000
commerce.retry-ms=1000
commerce.max-attempts=3
logging.level.root=WARN
logging.level.dev.commerceinsight=INFO
